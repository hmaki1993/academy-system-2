<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Cairo:wght@200..1000&family=Inter:wght@100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lexend:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap"
    rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <meta name="theme-color" content="#050505">
  <title>ELITE SYSTEM ACTIVE</title>
  <script>
      // Global Image Error Handler to catch legacy 404 logos
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'IMG') {
          const src = e.target.src.toLowerCase();
          const legacyWords = ['healy', 'fame', 'dark_logo', 'light_logo'];
          if (legacyWords.some(word => src.includes(word))) {
            console.log(' Global Restore: Replacing legacy 404 image:', e.target.src);
            e.target.src = '/logo.png';
          }
        }
      }, true);

    // Immediate branding & theme application to prevent flash on refresh
    (function () {
      try {
        const hash = window.location.hash || '';
        const root = document.documentElement;

        if (hash.includes('/jump-rope')) {
          // --- Standalone Jump Rope Mode ---
          const jrSaved = localStorage.getItem('jump_rope_app_settings');
          const jr = jrSaved ? JSON.parse(jrSaved) : { appName: 'Jump Rope Pro', themeId: 'ember' };
          
          document.title = jr.appName || 'Jump Rope Pro';
          
          // Apply minimal theme tokens immediately
          const themes = {
            ember: { p: '#ff3b30', bg: '#0d0302', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            ocean: { p: '#0ea5e9', bg: '#01090f', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            aurora: { p: '#a78bfa', bg: '#06020f', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            forest: { p: '#22c55e', bg: '#020f05', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            gold: { p: '#f59e0b', bg: '#0f0a02', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            rose: { p: '#f43f5e', bg: '#0f0207', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            'pure-black': { p: '#fff', bg: '#000', t: '#fff', low: 'rgba(255,255,255,0.2)' },
            'pure-white': { p: '#000', bg: '#fff', t: '#000', low: 'rgba(0,0,0,0.2)' }
          };
          const theme = themes[jr.themeId] || themes.ember;
          root.style.setProperty('--color-primary', theme.p);
          root.style.setProperty('--color-text-base', theme.t);
          root.style.setProperty('--jr-text-low', theme.low);
          root.style.setProperty('--jr-bg', theme.bg);
          root.style.color = theme.t;
        } else {
          // --- Main Academy Mode ---
          const saved = localStorage.getItem('gym_settings');
          if (!saved) return;
          const s = JSON.parse(saved);

          if (s.academy_name) document.title = s.academy_name;
          if (s.logo_url) {
            const legacyWords = ['healy', 'fame', 'dark_logo', 'light_logo'];
            const isLegacy = typeof s.logo_url === 'string' && legacyWords.some(word => s.logo_url.toLowerCase().includes(word));
            const finalLogoUrl = isLegacy ? '/logo.png?v=2' : (s.logo_url.includes('?') ? s.logo_url : s.logo_url + '?v=2');
            
            // 1. Update Favicon
            let favicon = document.querySelector('link[rel="icon"]');
            if (!favicon) {
              favicon = document.createElement('link');
              favicon.rel = 'icon';
              favicon.type = 'image/png';
              document.head.appendChild(favicon);
            }
            favicon.href = finalLogoUrl;

            // 2. Dynamic PWA Manifest
            let manifestLink = document.querySelector('link[rel="manifest"]');
            if (!manifestLink) {
              manifestLink = document.createElement('link');
              manifestLink.rel = 'manifest';
              manifestLink.crossOrigin = 'use-credentials';
              document.head.appendChild(manifestLink);
            }
            const dynamicManifest = {
                "short_name": s.academy_name || "Academy",
                "name": s.academy_name || "Fame Academy System",
                "icons": [
                    { "src": finalLogoUrl, "sizes": "192x192 256x256 512x512", "type": "image/png", "purpose": "any maskable" }
                ],
                "start_url": ".",
                "display": "standalone",
                "theme_color": s.primary_color || "#A30000",
                "background_color": s.secondary_color || "#050505"
            };
            const blob = new Blob([JSON.stringify(dynamicManifest)], {type: 'application/json'});
            manifestLink.href = URL.createObjectURL(blob);
          }

          if (s.primary_color) root.style.setProperty('--color-primary', s.primary_color);
          if (s.secondary_color) {
            root.style.setProperty('--color-secondary', s.secondary_color);
            root.style.setProperty('--color-background', s.secondary_color);

            // Fast luminance check for text colors
            const hex = s.secondary_color;
            if (typeof hex === 'string' && hex.startsWith('#')) {
              const c = hex.substring(1);
              const rgb = parseInt(c.length === 3 ? c[0] + c[0] + c[1] + c[1] + c[2] + c[2] : c, 16);
              const r = (rgb >> 16) & 0xff;
              const g = (rgb >> 8) & 0xff;
              const b = (rgb >> 0) & 0xff;
              const lum = 0.2126 * (r / 255) + 0.7152 * (g / 255) + 0.0722 * (b / 255);
              if (lum > 0.6) {
                root.style.setProperty('--color-text-base', s.text_color_base || '#0a0a0f');
                root.style.setProperty('--color-text-muted', s.text_color_muted || '#475569');
                root.style.setProperty('--is-light-mode', '1');
              } else {
                root.style.setProperty('--color-text-base', s.text_color_base || '#f8fafc');
                root.style.setProperty('--color-text-muted', s.text_color_muted || 'rgba(255, 255, 255, 0.6)');
                root.style.setProperty('--is-light-mode', '0');
              }
            }
          }
          if (s.accent_color) root.style.setProperty('--color-accent', s.accent_color);
          if (s.surface_color) root.style.setProperty('--color-surface', s.surface_color);
          if (s.input_bg_color) root.style.setProperty('--color-input-bg', s.input_bg_color);
          if (s.font_family && s.font_family !== 'Cairo') root.style.setProperty('font-family', '"' + s.font_family + '", sans-serif');
          if (s.font_scale) root.style.setProperty('font-size', (s.font_scale * 100) + '%');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
